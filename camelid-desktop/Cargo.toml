[package]
name = "camelid-desktop"
version = "0.7.3"
edition = "2021"
# MSRV floor, not the build toolchain — see the note in the workspace Cargo.toml.
rust-version = "1.89"
description = "Camelid Desktop — native chat app that embeds the Camelid engine as a loopback sidecar"
license = "MIT"
repository = "https://github.com/timtoole02/Camelid"
# Never published to crates.io; it is shipped only as a bundled desktop artifact.
publish = false

[[bin]]
name = "camelid-desktop"
path = "src/main.rs"

[build-dependencies]
# Embeds the splash assets and platform icon resources, and validates tauri.conf.json.
tauri-build = { version = "2", features = [] }

[dependencies]
# Native-webview shell. The dialog plugin is the one narrow native bridge used
# by the sidecar UI: choosing a model-library directory.
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
# Hiding every window is App Nap's trigger; the NSProcessInfo activity keeps the engine
# supervisor's ticks on time while the app is backgrounded. Both are already in the lock.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSProcessInfo",
    "NSString",
] }

[target.'cfg(windows)'.dependencies]
# A second launch while the app is backgrounded must focus the running instance, never start
# a second sidecar and a second model load. Windows only: there the plugin keys on a named
# mutex and a window class, both local to the user's session. Its macOS socket is a fixed
# path in the shared /tmp, which another account can own or occupy; macOS relaunches arrive
# as RunEvent::Reopen instead (see README "What is NOT claimed"). Pinned exactly: 2.4.4 is
# the newest release whose `tauri ^2.10` requirement the locked tauri satisfies, and a caret
# range could later pull a Tauri upgrade in through this crate alone.
tauri-plugin-single-instance = "=2.4.4"
# Job object with KILL_ON_JOB_CLOSE: ties the sidecar's lifetime to ours so a desktop
# crash cannot orphan a `camelid` process. Same major as the server crate uses (0.59).
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
