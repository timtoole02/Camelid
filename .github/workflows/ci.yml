name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      os:
        description: 'OS legs to run: comma-separated (linux,macos,windows) or "all"'
        required: false
        default: 'all'

jobs:
  # ---------------------------------------------------------------------------
  # OS-matrix planner. Computes which of the three OS legs to run, so a single-OS
  # push stays green without disabling cross-OS CI for everyone else.
  #
  # DEFAULT (no selector anywhere): the full ubuntu+macos+windows matrix runs,
  # exactly as before — nothing is hidden unless you opt in.
  #
  # OPT IN to a subset by tagging the commit message (or PR title / PR label),
  # any of these forms (case-insensitive):
  #   [ci-os: windows]              -> windows leg only
  #   [ci-os: macos,linux]          -> macos + linux, skip windows
  #   [windows-only] / [win-only]   -> windows leg only
  #   [macos-only]   / [mac-only]   -> macos leg only
  #   [linux-only]                  -> linux leg only
  # Or trigger manually (workflow_dispatch) and set the `os` input.
  #
  # An unrecognized / typo'd selector falls back to the FULL matrix (fail-safe
  # toward more coverage, never toward silently skipping a platform).
  # ---------------------------------------------------------------------------
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      run_linux: ${{ steps.plan.outputs.run_linux }}
      run_macos: ${{ steps.plan.outputs.run_macos }}
      run_windows: ${{ steps.plan.outputs.run_windows }}
    steps:
      - name: Plan OS matrix
        id: plan
        # Inputs are passed via env (NOT interpolated into the script body) so a
        # crafted commit message / PR title cannot inject shell.
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_OS: ${{ github.event.inputs.os }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail

          # Pick the selector source. Manual dispatch input wins; otherwise scan
          # the commit message + PR title + PR labels (any may carry the tag).
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${DISPATCH_OS:-}" ]; then
            sel="${DISPATCH_OS}"
          else
            scan="$(printf '%s %s %s' "${COMMIT_MSG:-}" "${PR_TITLE:-}" "${PR_LABELS:-}" \
                    | tr '[:upper:]' '[:lower:]')"
            want=""
            # [ci-os: ...] explicit (supports a comma/space list inside the brackets)
            case "$scan" in
              *'[ci-os:'*)
                want="$(printf '%s' "$scan" \
                  | sed -n 's/.*\[ci-os:[[:space:]]*\([a-z, ]*\)\].*/\1/p')"
                ;;
            esac
            # Shorthand single-OS tags
            case "$scan" in *'[windows-only]'*|*'[win-only]'*)  want="$want windows";; esac
            case "$scan" in *'[macos-only]'*|*'[mac-only]'*|*'[osx-only]'*) want="$want macos";; esac
            case "$scan" in *'[linux-only]'*)                   want="$want linux";;   esac
            sel="$want"
          fi

          # Normalize separators to spaces, lower-case.
          sel="$(printf '%s' "$sel" | tr ',' ' ' | tr '[:upper:]' '[:lower:]')"

          run_linux=false; run_macos=false; run_windows=false
          for tok in $sel; do
            case "$tok" in
              linux|ubuntu)        run_linux=true;;
              macos|mac|osx|apple) run_macos=true;;
              windows|win)         run_windows=true;;
              all)                 run_linux=true; run_macos=true; run_windows=true;;
            esac
          done

          # Nothing matched -> full matrix (the safe default).
          if [ "$run_linux" = false ] && [ "$run_macos" = false ] && [ "$run_windows" = false ]; then
            run_linux=true; run_macos=true; run_windows=true
          fi

          # Build matrix.include[], preserving the original per-OS feature flags:
          #   ubuntu  -> --all-features (also builds+lints the opt-in CUDA path)
          #   macos   -> default       (Metal lane; no cudarc)
          #   windows -> default       (CUDA is already the default build there)
          inc=""
          [ "$run_linux"   = true ] && inc="$inc {\"os\":\"ubuntu-latest\",\"features\":\"--all-features\"},"
          [ "$run_macos"   = true ] && inc="$inc {\"os\":\"macos-latest\",\"features\":\"\"},"
          [ "$run_windows" = true ] && inc="$inc {\"os\":\"windows-latest\",\"features\":\"\"},"
          inc="${inc%,}"
          matrix="{\"include\":[ $inc ]}"

          {
            echo "matrix=$matrix"
            echo "run_linux=$run_linux"
            echo "run_macos=$run_macos"
            echo "run_windows=$run_windows"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### CI OS matrix"
            echo ""
            echo "| leg | run |"
            echo "| --- | --- |"
            echo "| ubuntu-latest  | $run_linux |"
            echo "| macos-latest   | $run_macos |"
            echo "| windows-latest | $run_windows |"
          } >> "$GITHUB_STEP_SUMMARY"

  public-scrub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check for private operator details
        run: bash scripts/check-public-scrub.sh

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Audit public evidence bundles for private details
        run: node scripts/audit-evidence-bundle-privacy.mjs --strict

      - name: Verify public evidence bundle checksums
        run: bash scripts/check-evidence-bundle-checksums.sh

      # Design evidence makes the same privacy and checksum claims as a
      # qa/ bundle, and both gates default to that other root, so without
      # these two lines those claims are only self-attested.
      - name: Audit design evidence for private details
        run: node scripts/audit-evidence-bundle-privacy.mjs --root frontend/design-evidence --strict

      - name: Verify design evidence checksums
        run: bash scripts/check-evidence-bundle-checksums.sh frontend/design-evidence

      - name: Check public evidence claims
        run: node scripts/check-public-evidence-claims.mjs

      - name: Check ledger schema (camelid.ledger/v1)
        run: node scripts/check-ledger-schema.mjs

      - name: Check ledger drift (ledger == code contract; surfaces consistent)
        run: node scripts/check-ledger-drift.mjs

      # FitVerdict is serialized onto the catalog endpoints and the Models tab
      # branches on those exact strings, which it re-declares as JS literals. No
      # compiler links the two, and a frontend smoke asserting the frontend's own
      # literals passes either way — so a renamed variant would reach users as a
      # blank badge. Tie the vocabulary to src/fit.rs.
      - name: Check fit-verdict vocabulary (WebUI == src/fit.rs)
        run: node scripts/check-fit-verdict-vocabulary.mjs

      - name: Check CUDA batched-prefill parity gate wiring
        run: node scripts/check-cuda-prefill-parity-gate.mjs

      - name: Check README screenshot contract
        run: node scripts/test-readme-screenshot.mjs

      - name: Check README status contract
        run: |
          set -euo pipefail
          ! grep -n -E '^(## Current Status|As of 2026-05-22, Camelid is useful but deliberately narrow:|- \\*\\*(Working product surface|Supported exact rows|Next row|Blocked row|Performance posture):\\*\\*)' README.md

  rust:
    needs: [public-scrub, setup]
    strategy:
      fail-fast: false
      # Matrix is computed by the `setup` job. Each include entry carries `os`
      # and per-OS `features` (see the planner above). The default selection is
      # the full ubuntu+macos+windows set, identical to the previous static matrix:
      #
      # macos-latest is Apple Silicon, so it compiles and lints the
      # cfg(target_os = "macos") Metal path that ubuntu never sees. The Metal
      # tests self-skip when no GPU device is reported by the runner — which
      # means a green macOS leg proves the Metal path COMPILES, not that any of
      # it RAN. The "Metal lane capability probe" step below prints whether this
      # runner has a usable device and can build the resident pipelines, so that
      # is measured rather than assumed.
      # windows-latest (MSVC) is a first-class CPU target: it builds the
      # Windows file-I/O / mmap path (src/platform_fs.rs, the memmap2 wire
      # mapping) and runs the same exact-row gates as the other hosts.
      #
      # CUDA is the DEFAULT build on Windows only (build.rs injects the `cuda`
      # cfg and cudarc is a non-optional Windows dep), so the plain default build
      # on windows-latest already exercises the GPU backend. On Linux CUDA is
      # opt-in, so ubuntu-latest uses --all-features to also build and lint it
      # (cudarc dynamic-loads — no CUDA SDK needed, GPU tests self-skip without a
      # device). macOS has no cudarc (its GPU lane is Metal), so it uses the
      # default feature set. GPU parity is validated on a CUDA host.
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets ${{ matrix.features }} -- -D warnings

      # CAMELID_REQUIRE_METAL_TESTS=1 makes the macOS Metal lane fail-closed: the
      # device-gated skips (56 in src/metal.rs, plus the draft-rollback regression guard
      # in src/inference/tests.rs) become hard failures instead of silent passes. Enabled
      # because the capability probe below MEASURED this runner as capable:
      #   available=true resident_kernels=true device="Apple Paravirtual device"
      # If GitHub ever withdraws the paravirtual Metal device, this leg goes red with an
      # explicit message rather than quietly reverting to proving nothing — which is the
      # entire point.
      - name: Tests
        env:
          CAMELID_REQUIRE_METAL_TESTS: ${{ runner.os == 'macOS' && '1' || '' }}
          # Debug-build CLI-parsing tests carry the whole 40-variant clap
          # Command tree in one unoptimized frame (rustc does not merge stack
          # slots across match arms in debug), and the tree's growth pushed
          # gemma4_generate_harness_flags_default_off over the default 2 MiB
          # libtest thread stack on Linux. 8 MiB matches the main-thread stack
          # the shipped binary parses with; release builds are unaffected.
          RUST_MIN_STACK: 8388608
        run: cargo test --all-targets ${{ matrix.features }}

      # Everything above this line is a DEBUG build, and that is exactly how a
      # release-only defect in the NVFP4 encoder sat in main unnoticed: while
      # `amax` is still the literal 0.0, LLVM peels the first compare of the
      # sub-block amax scan and folds it into a max intrinsic (`fmaxnm` on
      # aarch64), which QUIETS a signaling NaN into the result instead of
      # discarding it the way the pin's `<` does. A leading sNaN therefore zeroed
      # the sub-block scale at -O and only at -O; every debug run was green.
      #
      # The suites below exist to reproduce the pin BYTE-FOR-BYTE, so they are
      # the ones that have to hold in the profile we actually ship. Scoped to
      # those rather than a second full `--all-targets` run to keep the added
      # wall-clock bounded — this gates the optimization-sensitive numeric
      # kernels, NOT the whole suite, so a release-only defect elsewhere is still
      # ungated. Runs on every OS leg on purpose: the defect was a codegen fold,
      # and codegen differs per target (the fmaxnm form is aarch64/macOS).
      - name: Tests (release, bit-exactness suites)
        # Explicit: the default shell on windows-latest is pwsh, which does not
        # take `\` line continuations.
        shell: bash
        env:
          RUST_MIN_STACK: 8388608
        run: |
          set -euo pipefail
          cargo test --release --lib ${{ matrix.features }} nvfp4
          cargo test --release ${{ matrix.features }} \
            --test nvfp4_format \
            --test nvfp4_wire_lane_refusals \
            --test nvfp4_e4b_spotcheck \
            --test runnable_dequant \
            --test dg_quant_parity \
            --test gemma4_kquant_regression

      # The Windows linker reserves an 8 MiB stack for camelid.exe because the
      # debug Clap parser needs it. Unit tests exercise a libtest executable,
      # so they cannot prove the shipped debug binary starts. Keep this direct
      # check adjacent to the standard test gate to catch a lost linker setting.
      - name: Debug CLI startup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Windows uses its default feature set here: build.rs enables CUDA for
          # this target, matching the empty matrix.features value on this leg.
          cargo build --bin camelid
          if ($LASTEXITCODE -ne 0) {
            throw "cargo build --bin camelid exited with $LASTEXITCODE"
          }

          # These were the historical overflowing entrypoints. Each constructs
          # the full Clap command tree before producing its respective output.
          $version = & .\target\debug\camelid.exe --version
          if ($LASTEXITCODE -ne 0) {
            throw "debug camelid --version exited with $LASTEXITCODE"
          }
          if ($version -notmatch '^camelid\s+\S+') {
            throw "unexpected debug version output: $version"
          }
          foreach ($arguments in @(@("--help"), @("serve", "--help"))) {
            $display = $arguments -join " "
            & .\target\debug\camelid.exe @arguments > $null
            if ($LASTEXITCODE -ne 0) {
              throw "debug camelid $display exited with $LASTEXITCODE"
            }
          }

      # Report, in the log, whether this runner can actually execute the macOS Metal test
      # lane. 56 device-gated tests in src/metal.rs and the draft-rollback regression guard
      # in src/inference/tests.rs all self-skip on a host with no usable GPU session, and a
      # skip is indistinguishable from a pass in the summary above. This step prints the two
      # capabilities that decide it (`available`, `resident_kernels`) so the assumption is
      # measured rather than asserted, and keeps reporting them on every run so a change in
      # the runner image is visible in the log rather than inferred from a red build.
      - name: Metal lane capability probe (macOS)
        if: runner.os == 'macOS'
        env:
          CAMELID_REQUIRE_METAL_TESTS: '1'
        run: cargo test --all-targets ${{ matrix.features }} metal_lane_capability_probe -- --nocapture

      - name: Docs
        run: cargo doc --no-deps ${{ matrix.features }}

  # Windows build / lint / test of the additive camelid-desktop crate. The `rust`
  # job above scopes clippy/test/doc to default-members (the server), so without this the
  # desktop crate would only be fmt-checked. WebView2 is Windows-only, but the crate itself
  # also builds on macOS (WKWebView), where the release `desktop-macos` job packages it;
  # this leg covers the Windows build rather than joining the cross-OS `rust` matrix.
  # It needs no frontend build: the desktop app bundles only its static splash; the embedded
  # web UI lives in camelid.exe, which this job does not build. The base tauri.conf.json
  # declares no sidecar resources (those are in the bundle-only overlay), so the crate builds
  # on a fresh checkout with no sidecar staged.
  #
  # Skipped when windows is not in the selected OS set (e.g. a [macos-only] / [linux-only]
  # push). A skipped job is reported green, and ci-gate treats it as a pass.
  desktop:
    needs: [public-scrub, setup]
    if: needs.setup.outputs.run_windows == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Clippy (camelid-desktop)
        run: cargo clippy -p camelid-desktop --all-targets -- -D warnings

      - name: Tests (camelid-desktop)
        run: cargo test -p camelid-desktop --all-targets

  validation-scripts:
    runs-on: ubuntu-latest
    needs: public-scrub
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Validation harness self-tests
        run: |
          set -euo pipefail
          for test_script in scripts/test-*.mjs; do
            echo "== ${test_script}"
            node "${test_script}"
          done

  frontend:
    runs-on: ubuntu-latest
    needs: public-scrub
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        id: build
        run: npm run build

      # Every smoke below carries this. The smokes are independent of each other,
      # so stopping at the first failure only hides the rest: a red gate then
      # takes one round trip per broken smoke to fully diagnose. Guarding on the
      # build keeps that from turning a broken build into a wall of identical
      # "missing dist" errors, and the job still fails on any smoke failure.
      - name: Frontend support-contract smoke
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run smoke:model-state

      - name: Frontend model-lanes smoke
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run smoke:model-lanes

      - name: Frontend catalog activation smoke
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run smoke:catalog-activation

      # Keeps the UI's size formatting on the same decimal convention as
      # src/catalog.rs. These drifted apart once already: the formatter divided
      # by 1024 while printing KB/MB/GB, so one GGUF read "3.4 GB" from the CLI
      # and "3.2 GB" in the Models page. Pure module check, so it does not need
      # the dist build the browser smokes depend on.
      - name: Frontend byte-units smoke
        if: ${{ !cancelled() }}
        run: npm run smoke:byte-units

      # Pure contract check for Web Auto: exact linked-URL repair/deduplication,
      # no-browse prompts, current-info detection, bounded untrusted evidence
      # injection, and hardened source metadata.
      - name: Frontend web-research smoke
        if: ${{ !cancelled() }}
        run: npm run smoke:web-research

      # Real compiled-UI coverage for Web Auto. A single loopback fixture serves
      # both assets and deterministic API/SSE responses, so this neither starts
      # a model process nor reaches the public web.
      - name: Frontend web-research browser smoke
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run smoke:web-research-browser

      # Keeps the stream event boundary used to separate research latency,
      # model TTFT, and post-first-content decode rate gated in CI. The Web Auto
      # smoke above covers cancellation; this lane covers SSE usage/fallbacks.
      - name: Frontend streaming telemetry smoke
        if: ${{ !cancelled() }}
        run: npm run smoke:streaming

      # Covers frontend/src/lib/firstRunActivation.js and lib/modelActivation.js:
      # which model a fresh install is offered (supported_* rows only, fit-filtered,
      # smallest first) and the inspect -> load -> readiness protocol behind the one
      # click. Also asserts the shipped ledger row and the shipped catalog id still
      # join, which is what makes the offer derived rather than hard-coded.
      - name: Frontend first-run activation smoke
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run smoke:first-run

      # Component-level: mounts the real first-run card in a browser against a
      # scripted backend and drives the two transitions that cannot be proved by
      # rendering markup -- retrying AFTER the artifact landed (which must not
      # re-download it) and cancelling when the backend disagrees that anything was
      # cancelled (404 mid-start, 409 after completion, unreadable probes).
      - name: Frontend first-run card component smoke
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run smoke:first-run-card

      # Component-level: the offline banner is the only surface a user sees when
      # the engine dies with the tab still open, and its branch is chosen from a
      # live probe of the dev-server launch hook. Drives both server shapes so the
      # packaged build can never regress to offering a control it cannot honour,
      # and the dev-server one-click Start keeps working.
      - name: Frontend offline banner smoke
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run smoke:offline-banner

      # Real-browser trusted-LAN flow: public UI bootstrap, missing/wrong/correct
      # key states, same-origin-only credential injection, exact-row Chat SSE,
      # mobile geometry, restricted navigation, and credential reuse on reload.
      - name: Frontend LAN Chat authentication smoke
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run smoke:lan-auth

      # Covers frontend/src/lib/catalogBrowse.js: fit labels/details, the
      # settled-vs-retryable `unknown` split, grouping and search ranking. The
      # script shipped with the lane but was never wired here, so none of that
      # logic was gated.
      - name: Frontend catalog browse smoke
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run smoke:catalog-browse

      - name: Frontend catalog companion download smoke
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run smoke:catalog-companion

      - name: Frontend model deletion smoke
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run smoke:model-deletion

      - name: Frontend 3B exact-row closure smoke
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run smoke:3b-closure

      - name: Frontend integration smoke
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run smoke:integration

      - name: Workspace logic smoke
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run smoke:workspace

      - name: Workspace read-only visual smoke
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          npm run preview > /tmp/camelid-workspace-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4175/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4175/ >/dev/null
          npm run smoke:workspace-visual

      - name: Frontend UI regression smoke
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run smoke:ui

  # ---------------------------------------------------------------------------
  # Single aggregate gate. Make THIS the only required status check in branch
  # protection (see the note in the PR/commit). It runs on every event and
  # passes when every upstream job either succeeded or was intentionally skipped
  # (single-OS scoping), and fails if any job that actually ran failed/cancelled.
  #
  # Why: when an OS leg is skipped, its own status context never reports, and a
  # required-but-missing context blocks merges forever. Requiring ci-gate instead
  # gives one stable context whatever the selected OS set.
  # ---------------------------------------------------------------------------
  ci-gate:
    needs: [setup, public-scrub, rust, desktop, validation-scripts, frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require no failed job (skips allowed)
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "Upstream job results: ${RESULTS}"
          for r in ${RESULTS}; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::A required CI job concluded with '$r'"; exit 1 ;;
            esac
          done
          echo "All required jobs passed (skipped legs allowed)."
