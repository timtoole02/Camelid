name: release

# Build a prebuilt `camelid` binary (with the web UI embedded) for each
# supported platform and attach it to the GitHub release, so most users never
# have to build from source. Triggered by pushing a version tag, or manually.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v0.1.1)'
        required: true
      skip_desktop:
        description: 'Skip the additive camelid-desktop (Windows + macOS) builds'
        required: false
        default: 'false'

permissions:
  contents: write

env:
  # The single release identity for this run. A tag push resolves to the pushed
  # tag; a workflow_dispatch resolves to the tag the operator asked to publish.
  # Every job checks THIS out and asserts the binary reports it, so a dispatch
  # cannot build one ref and attach those bytes to a different tag.
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
  # Any CUDA 12.x works: the NVRTC soname (nvrtc64_120_0.dll) is stable across the
  # 12.x series and cudarc is pinned to the 12.x ABI (`cuda-12090`). The matching
  # nvrtc-builtins ship in the same component, so the pair is always self-consistent.
  CUDA_VERSION: '12.9.1'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14        # Apple Silicon
            label: macos-arm64
          - os: ubuntu-latest
            label: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      # Pinned to RELEASE_TAG, not the triggering ref: a workflow_dispatch must
      # build the tag it is going to publish under, or the attached bytes are
      # not the tag's bytes.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      # The web UI is embedded into the binary at compile time, so it must be
      # built before cargo build.
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build web UI
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.87.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked --bin camelid

      # Linux x86_64 only: CUDA is compiled into this target's DEFAULT build, and the
      # resident engine compiles its kernels through NVRTC at runtime. NVRTC ships with
      # the CUDA *Toolkit*, not the driver, so without this the downloaded tarball
      # detects the GPU and then falls back to CPU on every ordinary driver-only host.
      # Mirrors what build-windows already does for the Windows ZIP. Only the NVRTC
      # component is installed — the driver itself is the user's and is not
      # redistributable.
      - name: Install CUDA NVRTC (packaging source)
        if: matrix.label == 'linux-x86_64'
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: ${{ env.CUDA_VERSION }}
          method: network
          sub-packages: '["nvrtc"]'

      - name: Package
        run: |
          set -euo pipefail
          dist="camelid-${{ matrix.label }}"
          mkdir -p "$dist"
          strip target/release/camelid || true
          cp target/release/camelid "$dist/"
          cp README.md LICENSE THIRD_PARTY_NOTICES.md "$dist/"
          # Stage the NVRTC redistributables beside the binary. The binary is linked
          # with `-Wl,-rpath,$ORIGIN` (.cargo/config.toml), so its own directory is on
          # the run-time search path and dlopen finds this pair with no LD_LIBRARY_PATH
          # from the user. Fail loudly rather than shipping a tarball that silently
          # cannot reach the GPU.
          # Invoked through `bash` rather than as ./script, matching how ci.yml runs
          # its shell gates: that does not depend on the executable bit surviving in
          # the index (it does not, when the file is authored on Windows).
          if [ "${{ matrix.label }}" = "linux-x86_64" ]; then
            bash scripts/package-linux-cuda.sh "$dist"
          fi
          tar -czf "$dist.tar.gz" "$dist"
          shasum -a 256 "$dist.tar.gz" > "$dist.tar.gz.sha256"

      # Open the box that actually ships. Everything above this point verifies
      # the STAGING directory (scripts/package-linux-cuda.sh) or the source tree
      # (ci.yml); nothing has ever inspected or executed the archive itself.
      # Extracting with the same tar a user runs also proves the archive is
      # readable and that symlinks survived packaging.
      - name: Verify the packaged artifact
        run: |
          set -euo pipefail
          dist="camelid-${{ matrix.label }}"
          rm -rf verify && mkdir -p verify
          tar -xzf "$dist.tar.gz" -C verify

          # NVRTC is staged into the Linux tarball only; macOS has no CUDA lane.
          nvrtc_flag=""
          if [ "${{ matrix.label }}" = "linux-x86_64" ]; then nvrtc_flag="--require-nvrtc"; fi

          node scripts/check-release-artifact.mjs \
            --dir verify \
            --label "${{ matrix.label }}" \
            --archive "$dist.tar.gz" \
            --checksum "$dist.tar.gz.sha256" \
            $nvrtc_flag \
            --out "$dist-check-receipt.json"

          # Asserted unconditionally. The checkout above pinned this job to
          # RELEASE_TAG, so the binary must report it whether this run came
          # from a tag push or a manual dispatch -- the release is published
          # under that same tag either way.
          node scripts/smoke-release-artifact.mjs \
            --dir "verify/$dist" \
            --label "${{ matrix.label }}" \
            --expect-version "${{ env.RELEASE_TAG }}" \
            --out "$dist-smoke-receipt.json"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: camelid-${{ matrix.label }}
          path: |
            camelid-${{ matrix.label }}.tar.gz
            camelid-${{ matrix.label }}.tar.gz.sha256

      # Receipts are diagnostic only: they are attached to the CI run, never to
      # the release and never committed (qa/evidence-bundles is a scrubbed,
      # checksum-audited tree and this is not one of its bundles).
      - name: Upload verification receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-receipts-${{ matrix.label }}
          path: camelid-${{ matrix.label }}-*-receipt.json
          if-no-files-found: ignore

  # Windows is built separately: its packaging differs from the unix matrix above
  # because a self-contained Windows download must ship the NVRTC redistributable
  # DLLs beside the exe (CUDA is the default Windows build; cudarc dynamic-loads,
  # so no CUDA SDK is needed to compile — the toolkit below is only the source of
  # those DLLs). Result: a user with only the NVIDIA driver gets GPU acceleration.
  build-windows:
    runs-on: windows-latest
    # `environment: release` lets the Azure app registration use ONE federated
    # credential (subject `repo:<owner>/<repo>:environment:release`) for every
    # tagged release — GitHub OIDC subjects for tags are per-tag and can't be
    # wildcarded, so an environment is the stable subject to bind the credential to.
    environment: release
    permissions:
      id-token: write # mint the OIDC token for azure/login
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build web UI
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.87.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked --bin camelid

      # windows-latest has no CUDA Toolkit; install just the NVRTC runtime
      # component to source the redistributable DLLs (sets CUDA_PATH for packaging).
      - name: Install CUDA NVRTC (packaging source)
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: ${{ env.CUDA_VERSION }}
          method: network
          sub-packages: '["nvrtc"]'

      - name: Stage release files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = 'camelid-windows-x64'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item target/release/camelid.exe $dist -Force
          Copy-Item README.md, LICENSE, THIRD_PARTY_NOTICES.md $dist -Force
          # Stage the NVRTC redistributables beside the exe (auto-detects the
          # toolkit via the CUDA_PATH set by the step above).
          ./scripts/package-windows-cuda.ps1 -OutDir $dist

      # OIDC sign-in: no stored client secret. Needs the job's `id-token: write`
      # permission above and a federated credential on the app registration whose
      # subject is `repo:<owner>/<repo>:environment:release`.
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Authenticode-sign camelid.exe so Windows shows your verified publisher and
      # SmartScreen reputation can accrue. Only the exe is signed — the NVIDIA NVRTC
      # DLLs are already NVIDIA-signed. Signs the staged copy BEFORE it is zipped.
      # Set the three SIGNING_* repo variables once identity validation completes.
      - name: Sign camelid.exe (Azure Artifact Signing)
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }} # e.g. https://wus2.codesigning.azure.net/
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\camelid-windows-x64
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Package zip + checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = 'camelid-windows-x64'
          Compress-Archive -Path "$dist/*" -DestinationPath "$dist.zip" -Force
          $hash = (Get-FileHash -Algorithm SHA256 "$dist.zip").Hash.ToLower()
          "$hash  $dist.zip" | Out-File -Encoding ascii -NoNewline "$dist.zip.sha256"

      # Verify the SIGNED, zipped artifact — after signing on purpose, so the
      # smoke proves the exe users actually receive still boots.
      - name: Verify the packaged artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = 'camelid-windows-x64'
          Remove-Item -Recurse -Force verify -ErrorAction SilentlyContinue
          Expand-Archive -Path "$dist.zip" -DestinationPath verify -Force

          node scripts/check-release-artifact.mjs `
            --dir verify `
            --label windows-x64 `
            --archive "$dist.zip" `
            --checksum "$dist.zip.sha256" `
            --require-nvrtc `
            --out "$dist-check-receipt.json"
          if ($LASTEXITCODE -ne 0) { throw "check-release-artifact failed ($LASTEXITCODE)" }

          # Compress-Archive packs the CONTENTS, so the payload is at the root.
          node scripts/smoke-release-artifact.mjs --dir verify --label windows-x64 --expect-version '${{ env.RELEASE_TAG }}' --out "$dist-smoke-receipt.json"
          if ($LASTEXITCODE -ne 0) { throw "smoke-release-artifact failed ($LASTEXITCODE)" }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: camelid-windows-x64
          path: |
            camelid-windows-x64.zip
            camelid-windows-x64.zip.sha256

      - name: Upload verification receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-receipts-windows-x64
          path: camelid-windows-x64-*-receipt.json
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------------
  # ADDITIVE: native Windows desktop app (camelid-desktop). Fully independent of the
  # server `build` / `build-windows` jobs AND of `release` — it is in NO job's `needs`,
  # so it cannot change or gate the server artifacts, their checksums, or the server
  # publish step. Skippable via the `skip_desktop` dispatch input. It bundles the SAME
  # release camelid.exe as a loopback sidecar, signs its artifacts with the same Azure
  # Trusted Signing identity as build-windows, and attaches them to the release itself.
  #
  # Signing layout (azure/artifact-signing-action is folder-based / post-build; Tauri
  # PATCHES camelid-desktop.exe during bundling so it can only be signed after the bundle):
  #   - sidecar camelid.exe  -> signed BEFORE bundling (so it is signed inside the installer
  #                             and the portable zip)
  #   - camelid-desktop.exe  -> signed AFTER bundling (portable copy)
  #   - NSIS installer       -> signed AFTER bundling
  # Accepted v1 limitation: the camelid-desktop.exe baked INSIDE the installer is unsigned
  # (the installer itself, the portable exe, and the sidecar are signed).
  # See camelid-desktop/README.md, DECISIONS.md D11.
  desktop-windows:
    if: ${{ github.event.inputs.skip_desktop != 'true' }}
    runs-on: windows-latest
    # Same Azure Trusted Signing identity as build-windows: the `release` environment is the
    # stable OIDC subject (repo:<owner>/<repo>:environment:release) the federated credential
    # is bound to. id-token mints the OIDC token; contents:write lets this job attach its own
    # signed artifacts to the release (the server `release` job stays untouched).
    environment: release
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The desktop app points at the engine's EMBEDDED web UI, so the UI must be baked
      # into camelid.exe (rust-embed) — identical to the server job's web UI build.
      - name: Build web UI
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.87.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      # The RELEASE sidecar is the shipped, working engine. (The debug build has a
      # pre-existing main-thread stack overflow at startup; release optimization elides it.)
      - name: Build sidecar (camelid.exe, release)
        run: cargo build --release --locked --bin camelid

      # windows-latest has no CUDA Toolkit; install just the NVRTC runtime component to
      # source the redistributable DLLs (same as the server job).
      - name: Install CUDA NVRTC (packaging source)
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: ${{ env.CUDA_VERSION }}
          method: network
          sub-packages: '["nvrtc"]'

      # Stage the sidecar + its NVRTC redistributables into camelid-desktop/sidecar/ so
      # `tauri build` bundles them as resources (resolved at runtime beside the sidecar).
      - name: Stage sidecar
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sidecar = 'camelid-desktop/sidecar'
          New-Item -ItemType Directory -Force -Path $sidecar | Out-Null
          Copy-Item target/release/camelid.exe $sidecar -Force
          ./scripts/package-windows-cuda.ps1 -OutDir $sidecar

      # OIDC sign-in (same federated credential as build-windows).
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Sign the sidecar BEFORE bundling so the camelid.exe baked into the installer AND the
      # portable zip is signed. (NVRTC DLLs are already NVIDIA-signed; filter = exe only.)
      - name: Sign sidecar camelid.exe (Azure Artifact Signing)
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\camelid-desktop\sidecar
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Build desktop bundle (NSIS installer)
        working-directory: camelid-desktop
        # The bundle-only config overlay adds the staged sidecar/* as resources. It is
        # kept out of the base tauri.conf.json so a plain `cargo build -p camelid-desktop`
        # (no sidecar staged) never hits the empty-glob error.
        run: npx tauri build --config tauri.bundle.conf.json

      # Assemble the portable layout, and stage the installer INTO it so a single post-build
      # signing pass covers both the portable camelid-desktop.exe and the NSIS installer.
      # (Tauri patches camelid-desktop.exe during bundling, so it can only be signed now —
      # after the bundle. The sidecar camelid.exe was already signed above.)
      - name: Assemble portable layout (+ stage installer for signing)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = 'camelid-desktop-windows-x64'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item target/release/camelid-desktop.exe $dist -Force
          # Portable layout: sidecar + NVRTC sit BESIDE the desktop exe (beside-exe resolution).
          Copy-Item camelid-desktop/sidecar/* $dist -Force
          Copy-Item README.md, LICENSE, THIRD_PARTY_NOTICES.md $dist -Force
          Copy-Item camelid-desktop/README.md (Join-Path $dist 'DESKTOP_README.md') -Force
          $nsis = Get-ChildItem -Recurse -Path target/release/bundle/nsis -Filter *.exe | Select-Object -First 1
          Copy-Item $nsis.FullName (Join-Path $dist $nsis.Name) -Force
          "installer=$($nsis.Name)" | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii -Append
          Write-Host "installer: $($nsis.Name)"

      # Sign the portable camelid-desktop.exe AND the NSIS installer (both now in $dist).
      # filter = exe signs every .exe in the folder (re-signing the already-signed sidecar
      # camelid.exe is harmless); the NVRTC DLLs are left as their NVIDIA signatures.
      - name: Sign desktop exe + installer (Azure Artifact Signing)
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\camelid-desktop-windows-x64
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Package portable zip + checksum (extract signed installer)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = 'camelid-desktop-windows-x64'
          # Move the signed installer OUT of the portable folder (it is a separate artifact).
          Move-Item (Join-Path $dist $env:installer) . -Force
          Compress-Archive -Path "$dist/*" -DestinationPath "$dist.zip" -Force
          $hash = (Get-FileHash -Algorithm SHA256 "$dist.zip").Hash.ToLower()
          "$hash  $dist.zip" | Out-File -Encoding ascii -NoNewline "$dist.zip.sha256"

      # The portable layout depends on beside-exe resolution, so the contract
      # check also proves the sidecar and its NVRTC pair travelled with the
      # desktop exe, and that the NSIS installer was moved OUT before zipping.
      # The boot smoke drives the SIDECAR: launching a Tauri GUI headless on a
      # runner proves nothing, whereas the engine it bundles is the thing that
      # must serve. A failure here still cannot block the server release — this
      # job is in no other job's `needs`.
      - name: Verify the packaged desktop artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = 'camelid-desktop-windows-x64'
          Remove-Item -Recurse -Force verify-desktop -ErrorAction SilentlyContinue
          Expand-Archive -Path "$dist.zip" -DestinationPath verify-desktop -Force

          node scripts/check-release-artifact.mjs `
            --dir verify-desktop `
            --label desktop-windows-x64 `
            --archive "$dist.zip" `
            --checksum "$dist.zip.sha256" `
            --require-nvrtc `
            --out "$dist-check-receipt.json"
          if ($LASTEXITCODE -ne 0) { throw "check-release-artifact failed ($LASTEXITCODE)" }

          node scripts/smoke-release-artifact.mjs --dir verify-desktop --label desktop-windows-x64 --expect-version '${{ env.RELEASE_TAG }}' --out "$dist-smoke-receipt.json"
          if ($LASTEXITCODE -ne 0) { throw "smoke-release-artifact failed ($LASTEXITCODE)" }

          # The installer is published separately and must exist as its own file.
          $setup = Get-ChildItem -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $setup) { throw 'no NSIS installer was produced' }
          if ($setup.Length -le 0) { throw "installer $($setup.Name) is zero bytes" }
          Write-Host "installer: $($setup.Name) ($([math]::Round($setup.Length / 1MB, 1)) MB)"

      - name: Upload desktop artifacts (CI)
        uses: actions/upload-artifact@v4
        with:
          name: camelid-desktop-windows-x64
          path: |
            camelid-desktop-windows-x64.zip
            camelid-desktop-windows-x64.zip.sha256
            *-setup.exe

      - name: Upload verification receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-receipts-desktop-windows-x64
          path: camelid-desktop-windows-x64-*-receipt.json
          if-no-files-found: ignore

      # Publish the SIGNED desktop artifacts to the SAME GitHub release, independently of the
      # server `release` job (which is left untouched and is in no way gated by this job).
      # softprops is idempotent: it creates the release if absent, or appends these files if
      # the server job already created it. A desktop failure therefore never blocks the
      # server release; it just means the desktop files are not attached.
      - name: Publish signed desktop artifacts to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            camelid-desktop-windows-x64.zip
            camelid-desktop-windows-x64.zip.sha256
            *-setup.exe
          fail_on_unmatched_files: true

  # ---------------------------------------------------------------------------------
  # ADDITIVE: native macOS desktop app (camelid-desktop on Apple Silicon). Same
  # independence contract as desktop-windows: it is in NO job's `needs`, so it cannot
  # change or gate the server artifacts, their checksums, or the server publish step,
  # and it is skippable via the same `skip_desktop` dispatch input. It reuses
  # scripts/build-macos-desktop.sh — the exact path a developer runs locally — which
  # builds the web UI, the release Metal-enabled `camelid` sidecar, the ad-hoc-signed
  # .app, and a drag-to-Applications DMG. There is no Developer ID identity yet, so
  # the bundle is ad-hoc signed and NOT notarized; scripts/get-desktop-macos.sh is
  # the documented quarantine-free install path. See camelid-desktop/README.md.
  desktop-macos:
    if: ${{ github.event.inputs.skip_desktop != 'true' }}
    runs-on: macos-14 # Apple Silicon; build-macos-desktop.sh refuses non-arm64 hosts
    permissions:
      contents: write # attach the DMG to the release (no signing secrets involved)
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.87.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # One build path for CI and developers: the script builds the frontend, the
      # release sidecar, the Tauri .app, and the DMG (ad-hoc signature). Invoked
      # through `bash` like every other repo script in CI, so it does not depend
      # on the executable bit surviving in the index.
      - name: Build the app bundle and DMG
        run: bash scripts/build-macos-desktop.sh

      # The DMG is renamed to a STABLE, versionless asset name so
      # `releases/latest/download/camelid-desktop-macos-arm64.dmg` — the URL
      # scripts/get-desktop-macos.sh and the README rely on — is the same for
      # every release. (GitHub also rewrites the space in the Tauri file name
      # on upload, so the built name could not be published verbatim anyway.)
      - name: Stage the DMG under its release name
        run: |
          set -euo pipefail
          version="$(node -e 'const fs = require("fs"); process.stdout.write(JSON.parse(fs.readFileSync("camelid-desktop/tauri.conf.json", "utf8")).version)')"
          src="target/release/bundle/dmg/Camelid Desktop_${version}_aarch64.dmg"
          if [ ! -f "$src" ]; then
            echo "expected DMG not found: $src" >&2
            exit 1
          fi
          cp "$src" camelid-desktop-macos-arm64.dmg
          shasum -a 256 camelid-desktop-macos-arm64.dmg > camelid-desktop-macos-arm64.dmg.sha256

      # Open the box that ships, like the server jobs: mount the DMG a user would
      # mount, copy the app out the way the installer copies it, verify the ad-hoc
      # signature survived the round-trip, and boot the BUNDLED sidecar model-less.
      # The sidecar is the engine that must serve — launching the Tauri GUI
      # headless on a runner proves nothing (same reasoning as desktop-windows).
      # The smoke reuses the macos-arm64 spec: the bundled sidecar directory holds
      # the same single `camelid` binary the server tarball ships.
      - name: Verify the packaged desktop artifact
        run: |
          set -euo pipefail
          # The published .sha256 must name and match the exact bytes being
          # uploaded — proven with the SAME parser the other jobs' gates use
          # (a one-record sidecar the user's own `shasum -c` also consumes),
          # plus that literal user command itself.
          shasum -a 256 -c camelid-desktop-macos-arm64.dmg.sha256
          node --input-type=module -e '
            import { readFile } from "node:fs/promises"
            import { parseChecksumFile, sha256File } from "./scripts/check-release-artifact.mjs"
            const record = parseChecksumFile(await readFile("camelid-desktop-macos-arm64.dmg.sha256", "utf8"))
            if (record.name !== "camelid-desktop-macos-arm64.dmg") throw new Error(`sidecar names ${record.name}`)
            const hash = await sha256File("camelid-desktop-macos-arm64.dmg")
            if (hash !== record.hash) throw new Error(`sidecar hash ${record.hash} != actual ${hash}`)
            console.log("checksum sidecar round-trip OK")
          '
          rm -rf verify-desktop dmg-mount && mkdir -p verify-desktop dmg-mount
          hdiutil attach camelid-desktop-macos-arm64.dmg -nobrowse -readonly -mountpoint dmg-mount -quiet
          test -d "dmg-mount/Camelid Desktop.app"
          test -L "dmg-mount/Applications"
          ditto --noextattr --noqtn "dmg-mount/Camelid Desktop.app" "verify-desktop/Camelid Desktop.app"
          # Freshly attached volumes can be transiently busy on runners
          # (Spotlight/XProtect scan new mounts), so detach with retries and a
          # -force fallback. Everything below runs on the copied-out bundle,
          # not the mount.
          detached=0
          for attempt in 1 2 3 4 5; do
            if hdiutil detach dmg-mount -quiet 2>/dev/null; then detached=1; break; fi
            sleep 2
          done
          if [ "$detached" -eq 0 ]; then hdiutil detach dmg-mount -force; fi
          codesign --verify --deep --strict "verify-desktop/Camelid Desktop.app"
          # The bundled sidecar payload is a closed set: exactly the engine binary.
          [ "$(ls -A "verify-desktop/Camelid Desktop.app/Contents/Resources/sidecar")" = "camelid" ]
          node scripts/smoke-release-artifact.mjs \
            --dir "verify-desktop/Camelid Desktop.app/Contents/Resources/sidecar" \
            --label macos-arm64 \
            --expect-version "${{ env.RELEASE_TAG }}" \
            --out camelid-desktop-macos-arm64-smoke-receipt.json

      - name: Upload desktop artifacts (CI)
        uses: actions/upload-artifact@v4
        with:
          name: camelid-desktop-macos-arm64
          path: |
            camelid-desktop-macos-arm64.dmg
            camelid-desktop-macos-arm64.dmg.sha256

      - name: Upload verification receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-receipts-desktop-macos-arm64
          path: camelid-desktop-macos-arm64-*-receipt.json
          if-no-files-found: ignore

      # Publish to the SAME GitHub release, independently of the server `release`
      # job (identical pattern to desktop-windows: softprops is idempotent, and a
      # desktop failure never blocks the server release — the DMG is just absent).
      - name: Publish the desktop DMG to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            camelid-desktop-macos-arm64.dmg
            camelid-desktop-macos-arm64.dmg.sha256
          fail_on_unmatched_files: true

  release:
    needs: [build, build-windows]
    runs-on: ubuntu-latest
    steps:
      # Checkout FIRST, before anything is downloaded into the workspace.
      # actions/checkout finds no .git here, so it takes its "Deleting the
      # contents of ..." path and rmRF's the whole workspace -- which would
      # remove a `dist` populated by earlier steps, leaving the verify step to
      # fail on a missing directory and publishing nothing. The scripts this job
      # runs live in the repo, so the checkout has to happen either way; it just
      # has to happen before `dist` exists.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      # Download BY NAME, one step per artifact this job is responsible for.
      # `download-artifact` with neither `name` nor `pattern` fetches every
      # artifact in the run, and `merge-multiple: true` flattens them all into
      # one directory -- so a bare download would sweep the diagnostic
      # verification receipts (and whatever the independent desktop job had
      # finished uploading) into `dist`, and `files: dist/*` below would attach
      # them to the public release. Naming each artifact keeps the published
      # set exact and fails closed if one is missing.
      - name: Download the macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: camelid-macos-arm64
          path: dist

      - name: Download the Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: camelid-linux-x86_64
          path: dist

      - name: Download the Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: camelid-windows-x64
          path: dist

      # Nothing but the three server archives and their sidecars may reach the
      # release, and every sidecar must be one record naming its own archive.
      # This reuses the same parser the build-time check uses, so the two gates
      # cannot drift and a `shasum -c` run by a user verifies what CI verified.
      - name: Verify checksums after the artifact round-trip
        run: |
          node scripts/verify-release-checksums.mjs \
            --dir dist \
            --expect camelid-macos-arm64.tar.gz \
            --expect camelid-linux-x86_64.tar.gz \
            --expect camelid-windows-x64.zip

      - name: Publish to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
